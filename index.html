<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Palak</title>
<meta name="theme-color" content="#07040f">
<meta property="og:title" content="For Palak">
<meta property="og:description" content="A little game I made for you. 5 levels, one secret.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Poppins:wght@300;400;500&family=Dancing+Script:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="fx"></canvas>
<header id="hud" hidden><div id="slots"></div></header>
<main id="app"></main>
<button id="hintBtn" class="ghost" hidden>Need a hint?</button>
<div id="toast"></div>
<div id="modal" hidden><div class="card"><div id="mbody"></div><button id="mclose" class="btn">Close</button></div></div>
<section id="lock">
  <p>Something is waiting for you here.</p>
  <div id="lockCount">...</div>
  <p>It opens at midnight on 23 November.</p>
</section>
<audio id="song" src="song.mp3" loop preload="none"></audio>
<script src="script.js"></script>
</body>
</html>
